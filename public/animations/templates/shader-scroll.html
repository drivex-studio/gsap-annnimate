<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ANIMATION_NAME}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      width: 100%;
    }
    .preview-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 2rem;
    }
    .preview-container.is-fullwidth {
      padding: 0;
    }
    {{ANIMATION_CSS}}
  </style>
</head>
<body>
  <div class="preview-container">
    {{ANIMATION_HTML}}
  </div>
  {{ANIMATION_SCRIPTS}}
</body>
</html>
